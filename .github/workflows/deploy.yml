name: Deploy static content to Pages

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci || npm install
      - name: Build
        env:
          VITE_SUPABASE_URL: "https://gthkvypeazpuojaglqps.supabase.co"
          VITE_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_CzpcwU4BM1En3wSSJ98tvA_bYX5zWuI"
          VITE_SUPABASE_PROJECT_ID: "gthkvypeazpuojaglqps"
        run: npm run build
      - name: Copy 404 & nojekyll
        run: cp docs/index.html docs/404.html && touch docs/.nojekyll
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
